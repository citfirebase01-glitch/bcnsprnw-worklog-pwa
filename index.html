<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ระบบรายงานการปฏิบัติงาน วพบ.สวรรค์ประชารักษ์</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#be123c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="รายงาน Tor">
  <link rel="apple-touch-icon" href="https://lh5.googleusercontent.com/d/1P3AjK1L5IAhKvStA5e27okTWn0f0dfbK">
  <link rel="icon" type="image/png" href="https://lh5.googleusercontent.com/d/1P3AjK1L5IAhKvStA5e27okTWn0f0dfbK">

  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc;
    }

    /* กรอบแสดงผลระบบ Google Apps Script แบบเต็มจอ 100% */
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* แบนเนอร์ปุ่ม One-Click Install สไลด์ขึ้นมาจากขอบล่าง */
    .pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(180%);
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 99999;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pwa-install-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* บนจอมือถือ ให้แบนเนอร์ลอยเหนือแถบเมนูด้านล่าง */
    @media (max-width: 600px) {
      .pwa-install-banner {
        bottom: 74px;
        width: calc(100% - 24px);
        padding: 10px 14px;
      }
    }

    .banner-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .banner-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(190, 18, 60, 0.2);
      flex-shrink: 0;
    }

    .banner-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .banner-title {
      font-size: 0.90rem;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-subtitle {
      font-size: 0.76rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-install-now {
      background: linear-gradient(135deg, #be123c, #9f1239);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(190, 18, 60, 0.3);
      transition: all 0.2s ease;
    }

    .btn-install-now:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(190, 18, 60, 0.4);
    }

    .btn-close-banner {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-close-banner:hover {
      color: #475569;
    }

    /* Modal แนะนำสำหรับ iOS (iPhone / iPad) */
    .ios-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .ios-modal-overlay.show {
      display: flex;
    }

    .ios-modal-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .ios-modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 14px;
    }

    .ios-step {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      color: #334155;
    }

    .ios-step-icon {
      font-size: 1.25rem;
      color: #be123c;
      width: 24px;
      text-align: center;
    }

    .btn-got-it {
      margin-top: 10px;
      width: 100%;
      background: #be123c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- URL Google Apps Script Web App ของระบบงานหลัก -->
  <!-- ============================================== -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbyHNQRaC7Vjxlg6NIkO-_5lf8eLd6Bp01HKI772MfZypbocjLIrhcCZigN_DK7Cg9oG/exec" 
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write;"
    title="ระบบรายงานการปฏิบัติงาน วพบ.สวรรค์ประชารักษ์">
  </iframe>

  <!-- Smart One-Click Install Banner -->
  <div id="pwaBanner" class="pwa-install-banner">
    <div class="banner-brand">
      <img src="https://lh5.googleusercontent.com/d/1P3AjK1L5IAhKvStA5e27okTWn0f0dfbK" alt="App Logo" class="banner-icon">
      <div class="banner-text">
        <span class="banner-title">ระบบรายงานการปฏิบัติงาน</span>
        <span class="banner-subtitle">ติดตั้งใช้งานแบบแอปพลิเคชัน</span>
      </div>
    </div>
    <div class="banner-actions">
      <button type="button" class="btn-install-now" id="btnInstallPwa" onclick="installAppOneClick()">
        <i class="fa-solid fa-download"></i>
        <span>ติดตั้ง</span>
      </button>
      <button type="button" class="btn-close-banner" onclick="dismissBanner()" title="ปิดแบนเนอร์">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- iOS Install Instruction Modal -->
  <div id="iosModal" class="ios-modal-overlay" onclick="closeIosModal(event)">
    <div class="ios-modal-card" onclick="event.stopPropagation()">
      <div style="font-size: 2.2rem; color: #be123c; margin-bottom: 8px;">
        <i class="fa-brands fa-apple"></i>
      </div>
      <h3 class="ios-modal-title">วิธีติดตั้งบน iPhone / iPad</h3>
      
      <div class="ios-step">
        <span class="ios-step-icon"><i class="fa-solid fa-arrow-up-from-bracket"></i></span>
        <span>1. แตะปุ่ม <b>"แชร์" (Share)</b> ที่แถบเมนูด้านล่างของ Safari</span>
      </div>

      <div class="ios-step">
        <span class="ios-step-icon"><i class="fa-regular fa-square-plus"></i></span>
        <span>2. เลื่อนลงแล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b></span>
      </div>

      <div class="ios-step">
        <span class="ios-step-icon"><i class="fa-solid fa-check"></i></span>
        <span>3. แตะ <b>"เพิ่ม" (Add)</b> ที่มุมขวาบน</span>
      </div>

      <button type="button" class="btn-got-it" onclick="closeIosModal()">เข้าใจแล้ว</button>
    </div>
  </div>

  <script>
    // 1. ลงทะเบียน Service Worker ให้เบราว์เซอร์รับรู้สถานะ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // 2. ตรวจสอบว่าแอปถูกติดตั้งและเปิดแบบ Standalone แล้วหรือไม่
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    let deferredPrompt = null;
    const banner = document.getElementById('pwaBanner');
    const iosModal = document.getElementById('iosModal');

    // ฟังก์ชันแสดงแบนเนอร์ (หากยังไม่ได้ติดตั้ง และยังไม่ได้กดปิดในรอบนี้)
    function showBannerIfEligible() {
      if (!isStandalone && !sessionStorage.getItem('pwa_dismissed')) {
        setTimeout(() => {
          if (banner) banner.classList.add('show');
        }, 1200);
      }
    }

    // 3. ดักจับ Native Prompt สำหรับ Android / Chrome / Edge
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showBannerIfEligible();
    });

    // 4. กรณีเปิดบน iOS / Safari หรืออุปกรณ์อื่นๆ ที่ไม่มี beforeinstallprompt
    window.addEventListener('load', () => {
      showBannerIfEligible();
    });

    // 5. ฟังก์ชันกดติดตั้งคลิกเดียว
    function installAppOneClick() {
      if (deferredPrompt) {
        // ฝั่ง Android / PC / Chrome: เด้งหน้าต่างติดตั้งของระบบขึ้นมาทันที!
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User installed the app');
            dismissBanner();
          }
          deferredPrompt = null;
        });
      } else {
        // ฝั่ง iOS (iPhone / iPad) หรือเบราว์เซอร์ที่ไม่มี Native Prompt
        if (iosModal) iosModal.classList.add('show');
      }
    }

    function closeIosModal() {
      if (iosModal) iosModal.classList.remove('show');
    }

    function dismissBanner() {
      if (banner) banner.classList.remove('show');
      sessionStorage.setItem('pwa_dismissed', 'true');
    }

    // ถ้าติดตั้งสำเร็จแล้ว ให้ซ่อนแบนเนอร์อัตโนมัติ
    window.addEventListener('appinstalled', () => {
      dismissBanner();
      console.log('App successfully installed!');
    });
  </script>
</body>
</html>
